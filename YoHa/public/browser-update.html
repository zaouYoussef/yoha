<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f97316" />
  <title>Mettez à jour votre navigateur — YoHa</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #fff7ed 0%, #ffffff 55%, #faf5ff 100%);
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 18px 40px -24px rgba(15, 23, 42, 0.35);
    }
    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 16px;
      object-fit: cover;
    }
    h1 {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.25;
    }
    p {
      margin: 12px 0 0;
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.55;
    }
    .actions {
      margin-top: 22px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    a, button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 12px 18px;
      border-radius: 999px;
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      border: 0;
      cursor: pointer;
    }
    .primary {
      background: #f97316;
      color: #fff;
    }
    .secondary {
      background: #f1f5f9;
      color: #334155;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/logo.png" alt="YoHa" width="64" height="64" />
    <h1>Votre navigateur est trop ancien</h1>
    <p>
      YoHa a besoin d&apos;une version récente de Chrome, Safari ou Firefox
      pour fonctionner correctement sur votre téléphone.
    </p>
    <p>
      Mettez à jour votre navigateur (ou installez Chrome), puis rouvrez
      <strong>yoha.ma</strong>.
    </p>
    <div class="actions">
      <a class="primary" href="https://www.google.com/chrome/">Installer / ouvrir Chrome</a>
      <a class="secondary" href="/">Réessayer YoHa</a>
    </div>
  </div>
</body>
</html>
